spring.application.name=genrag
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# DB connection timeout for 10 seconds
spring.datasource.hikari.initialization-fail-timeout=10000

# For development only
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.format_sql=true

# JWT related info
genrag.jwt.access-secret=${JWT_ACCESS_TOKEN_SECRET}
genrag.jwt.refresh-secret=${JWT_REFRESH_TOKEN_SECRET}
genrag.jwt.access-ttl=${JWT_ACCESS_TOKEN_TTL}
genrag.jwt.refresh-ttl=${JWT_REFRESH_TOKEN_TTL}

# Cookies related info
genrag.auth.cookie.secure=${COOKIE_SECURE}

# Frontend URL
genrag.frontend.url=${FRONTEND_URL}

# To read the X-Forwarded-For header sent by frontend proxy
server.forward-headers-strategy=framework

# AI Service URL
genrag.ai-service.url=${AI_SERVICE_URL}

# Bounds on the AI call. It runs inside the message transaction, so an unbounded
# read timeout would pin a database connection for as long as the AI service hangs.
genrag.ai-service.connect-timeout=${AI_SERVICE_CONNECT_TIMEOUT}
genrag.ai-service.read-timeout=${AI_SERVICE_READ_TIMEOUT}

# Storage provider
storage.provider=${STORAGE_PROVIDER}
storage.location=${STORAGE_LOCATION_PATH}

# File Upload Limit (API Gateway)
spring.servlet.multipart.max-file-size=${FILE_UPLOAD_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${FILE_UPLOAD_MAX_REQUEST_SIZE}