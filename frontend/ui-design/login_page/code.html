<style>
        body {
            background-color: #F8FAFC; /* Level 0 Background */
            font-family: 'Inter', sans-serif;

<body class="min-h-screen flex flex-col justify-center items-center p-md">
<!-- Brand Header -->

<!-- Authentication Container -->
<main class="w-full max-w-[440px] animate-fade-in duration-500">
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-xl auth-card">
<div class="mb-lg"><div class="flex flex-col items-center gap-md mb-lg">
  <div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center shadow-lg">
    <span class="material-symbols-outlined text-on-primary text-[32px]">description</span>
  </div>
  <div class="space-y-xs text-center">
    <h1 class="font-headline-xl text-headline-xl text-on-surface tracking-tight font-bold">DocAI Intellect</h1>
    <p class="font-body-md text-body-md text-on-surface-variant">Enterprise Document Intelligence</p>
  </div>
</div></div>
<!-- Login Form -->
<form class="space-y-lg" id="loginForm" onsubmit="return false;">
<!-- Username Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block" for="username">Username or Email</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
<input class="w-full h-12 pl-[44px] pr-md bg-surface border border-outline-variant rounded-lg font-body-md text-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none" id="username" name="username" placeholder="name@company.com" required="" type="text">
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full h-12 pl-[44px] pr-[44px] bg-surface border border-outline-variant rounded-lg font-body-md text-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute inset-y-0 right-0 pr-md flex items-center text-outline hover:text-on-surface transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-xs">
<input class="w-4 h-4 text-primary border-outline-variant rounded focus:ring-primary" id="remember" type="checkbox">
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember">Stay signed in for 30 days</label>
</div>
<!-- Submit Button -->
<button class="w-full h-12 bg-primary text-on-primary font-label-md text-label-md rounded-lg hover:bg-primary-container transition-all active:scale-[0.98] flex justify-center items-center gap-base" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Social/SSO Divider -->
<div class="relative my-xl">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-label-sm uppercase">

</div>
</div>
<!-- SSO Buttons -->
<div class="grid grid-cols-2 gap-md">


</div>
</div>
<!-- Footer Links -->
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                New to DocAI Intellect? 
                <a class="text-primary font-semibold hover:underline" href="#">Create an account</a>
</p>
</div>
</main>
<!-- Global Footer -->
<footer class="mt-auto w-full py-lg">
<div class="max-w-container-max mx-auto px-lg flex flex-col md:flex-row justify-between items-center gap-md">

<div class="flex gap-md">



</div>
</div>
</footer>
<script>
        // Password toggle logic
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const passwordIcon = document.getElementById('passwordIcon');

        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            passwordIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        });

        // Simple focus interaction
        const inputs = document.querySelectorAll('input[type="text"], input[type="password"]');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').classList.remove('text-primary');
            });
        });
    </script>
