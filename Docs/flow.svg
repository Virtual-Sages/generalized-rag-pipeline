<svg viewBox="-20 -20 840 912" width="840" height="912" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-label="State diagram of the document processing lifecycle. The main column runs Uploading, Uploaded, Ready for processing, then the four processing stages parsing, chunking, embedding and indexing, each as an in-progress state followed by a completed state, ending at Processed. Each in-progress state also branches right to its own failure state, and every failure state reaches the same terminal node as Processed.">
      <style>
    .n-box   { stroke-width: 1.7; }
    .n-lbl   { font-family: "Segoe UI", Arial, Helvetica, sans-serif; font-size: 13.5px; font-weight: 650; }
    .edge      { fill: none; stroke: #5f5f78; stroke-width: 1.6; }
    .edge-fail { fill: none; stroke: #c0453c; stroke-width: 1.6; }
    .e-lbl     { font-family: "Segoe UI", Arial, Helvetica, sans-serif; font-size: 12px; fill: #55556b; }
    .e-lbl-fail{ fill: #a83b33; }
    .term      { fill: #23233a; }
  </style>
  <rect x="-20" y="-20" width="840" height="912" fill="#ffffff"/>
  <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f5f78"/>
        </marker>
        <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0453c"/>
        </marker>
      </defs>

      <!-- start pseudo-state -->
      <circle cx="145" cy="16" r="10" class="term"/>
      <path d="M 145 26 L 145 50" class="edge" marker-end="url(#arrow)"/>
      <text class="e-lbl" x="162" y="42">User uploads via API Gateway</text>

      <!-- ============ main column ============ -->
      <rect x="40" y="54" width="210" height="36" rx="7" class="n-box" fill="#fdf3e2" stroke="#b57614"/>
      <text class="n-lbl" x="145" y="72" fill="#8a5a0c" text-anchor="middle" dominant-baseline="middle">UPLOADING</text>

      <path d="M 145 90 L 145 120" class="edge" marker-end="url(#arrow)"/>
      <text class="e-lbl" x="162" y="109">Stored successfully</text>

      <rect x="40" y="124" width="210" height="36" rx="7" class="n-box" fill="#eaf2fa" stroke="#2f6fb8"/>
      <text class="n-lbl" x="145" y="142" fill="#1f4d80" text-anchor="middle" dominant-baseline="middle">UPLOADED</text>

      <path d="M 145 160 L 145 190" class="edge" marker-end="url(#arrow)"/>
      <text class="e-lbl" x="162" y="179">FastAPI acknowledges storage access</text>

      <rect x="40" y="194" width="210" height="36" rx="7" class="n-box" fill="#eeecfa" stroke="#5847c8"/>
      <text class="n-lbl" x="145" y="212" fill="#3a2d90" text-anchor="middle" dominant-baseline="middle">READY_FOR_PROCESSING</text>

      <path d="M 145 230 L 145 260" class="edge" marker-end="url(#arrow)"/>
      <text class="e-lbl" x="162" y="249">FastAPI begins processing</text>

      <!-- parsing -->
      <rect x="40" y="264" width="210" height="36" rx="7" class="n-box" fill="#fdf3e2" stroke="#b57614"/>
      <text class="n-lbl" x="145" y="282" fill="#8a5a0c" text-anchor="middle" dominant-baseline="middle">PARSING</text>
      <path d="M 145 300 L 145 322" class="edge" marker-end="url(#arrow)"/>
      <rect x="40" y="326" width="210" height="36" rx="7" class="n-box" fill="#e6f4f6" stroke="#2f7d8c"/>
      <text class="n-lbl" x="145" y="344" fill="#1c5a66" text-anchor="middle" dominant-baseline="middle">PARSED</text>

      <!-- chunking -->
      <path d="M 145 362 L 145 384" class="edge" marker-end="url(#arrow)"/>
      <rect x="40" y="388" width="210" height="36" rx="7" class="n-box" fill="#fdf3e2" stroke="#b57614"/>
      <text class="n-lbl" x="145" y="406" fill="#8a5a0c" text-anchor="middle" dominant-baseline="middle">CHUNKING</text>
      <path d="M 145 424 L 145 446" class="edge" marker-end="url(#arrow)"/>
      <rect x="40" y="450" width="210" height="36" rx="7" class="n-box" fill="#e6f4f6" stroke="#2f7d8c"/>
      <text class="n-lbl" x="145" y="468" fill="#1c5a66" text-anchor="middle" dominant-baseline="middle">CHUNKED</text>

      <!-- embedding -->
      <path d="M 145 486 L 145 508" class="edge" marker-end="url(#arrow)"/>
      <rect x="40" y="512" width="210" height="36" rx="7" class="n-box" fill="#fdf3e2" stroke="#b57614"/>
      <text class="n-lbl" x="145" y="530" fill="#8a5a0c" text-anchor="middle" dominant-baseline="middle">EMBEDDING</text>
      <path d="M 145 548 L 145 570" class="edge" marker-end="url(#arrow)"/>
      <rect x="40" y="574" width="210" height="36" rx="7" class="n-box" fill="#e6f4f6" stroke="#2f7d8c"/>
      <text class="n-lbl" x="145" y="592" fill="#1c5a66" text-anchor="middle" dominant-baseline="middle">EMBEDDED</text>

      <!-- indexing -->
      <path d="M 145 610 L 145 632" class="edge" marker-end="url(#arrow)"/>
      <rect x="40" y="636" width="210" height="36" rx="7" class="n-box" fill="#fdf3e2" stroke="#b57614"/>
      <text class="n-lbl" x="145" y="654" fill="#8a5a0c" text-anchor="middle" dominant-baseline="middle">INDEXING</text>
      <path d="M 145 672 L 145 694" class="edge" marker-end="url(#arrow)"/>
      <rect x="40" y="698" width="210" height="36" rx="7" class="n-box" fill="#e6f4f6" stroke="#2f7d8c"/>
      <text class="n-lbl" x="145" y="716" fill="#1c5a66" text-anchor="middle" dominant-baseline="middle">INDEXED</text>

      <!-- processed -->
      <path d="M 145 734 L 145 764" class="edge" marker-end="url(#arrow)"/>
      <text class="e-lbl" x="162" y="753">All stages complete</text>
      <rect x="40" y="768" width="210" height="36" rx="7" class="n-box" fill="#e8f6ee" stroke="#2b8a5a"/>
      <text class="n-lbl" x="145" y="786" fill="#1d6440" text-anchor="middle" dominant-baseline="middle">PROCESSED</text>

      <!-- ============ failure column ============ -->
      <path d="M 250 72 L 476 72" class="edge-fail" marker-end="url(#arrow-fail)"/>
      <text class="e-lbl e-lbl-fail" x="363" y="64" text-anchor="middle">Upload to storage failed</text>
      <rect x="480" y="54" width="250" height="36" rx="7" class="n-box" fill="#fdecea" stroke="#c0453c"/>
      <text class="n-lbl" x="605" y="72" fill="#8f2f28" text-anchor="middle" dominant-baseline="middle">UPLOADING_FAILED</text>

      <path d="M 250 142 L 476 142" class="edge-fail" marker-end="url(#arrow-fail)"/>
      <text class="e-lbl e-lbl-fail" x="363" y="134" text-anchor="middle">Cannot read storage path</text>
      <rect x="480" y="124" width="250" height="36" rx="7" class="n-box" fill="#fdecea" stroke="#c0453c"/>
      <text class="n-lbl" x="605" y="142" fill="#8f2f28" text-anchor="middle" dominant-baseline="middle">ACCESS_FAILED</text>

      <path d="M 250 282 L 476 282" class="edge-fail" marker-end="url(#arrow-fail)"/>
      <text class="e-lbl e-lbl-fail" x="363" y="274" text-anchor="middle">Parsing failed</text>
      <rect x="480" y="264" width="250" height="36" rx="7" class="n-box" fill="#fdecea" stroke="#c0453c"/>
      <text class="n-lbl" x="605" y="282" fill="#8f2f28" text-anchor="middle" dominant-baseline="middle">PARSING_FAILED</text>

      <path d="M 250 406 L 476 406" class="edge-fail" marker-end="url(#arrow-fail)"/>
      <text class="e-lbl e-lbl-fail" x="363" y="398" text-anchor="middle">Chunking failed</text>
      <rect x="480" y="388" width="250" height="36" rx="7" class="n-box" fill="#fdecea" stroke="#c0453c"/>
      <text class="n-lbl" x="605" y="406" fill="#8f2f28" text-anchor="middle" dominant-baseline="middle">CHUNKING_FAILED</text>

      <path d="M 250 530 L 476 530" class="edge-fail" marker-end="url(#arrow-fail)"/>
      <text class="e-lbl e-lbl-fail" x="363" y="522" text-anchor="middle">Embedding failed</text>
      <rect x="480" y="512" width="250" height="36" rx="7" class="n-box" fill="#fdecea" stroke="#c0453c"/>
      <text class="n-lbl" x="605" y="530" fill="#8f2f28" text-anchor="middle" dominant-baseline="middle">EMBEDDING_FAILED</text>

      <path d="M 250 654 L 476 654" class="edge-fail" marker-end="url(#arrow-fail)"/>
      <text class="e-lbl e-lbl-fail" x="363" y="646" text-anchor="middle">Indexing failed</text>
      <rect x="480" y="636" width="250" height="36" rx="7" class="n-box" fill="#fdecea" stroke="#c0453c"/>
      <text class="n-lbl" x="605" y="654" fill="#8f2f28" text-anchor="middle" dominant-baseline="middle">INDEXING_FAILED</text>

      <!-- failure bus: every failure state is terminal -->
      <path d="M 730 72 L 768 72" class="edge-fail"/>
      <path d="M 730 142 L 768 142" class="edge-fail"/>
      <path d="M 730 282 L 768 282" class="edge-fail"/>
      <path d="M 730 406 L 768 406" class="edge-fail"/>
      <path d="M 730 530 L 768 530" class="edge-fail"/>
      <path d="M 730 654 L 768 654" class="edge-fail"/>
      <path d="M 768 72 L 768 842 L 415 842" class="edge-fail" marker-end="url(#arrow-fail)"/>

      <!-- processed to terminal -->
      <path d="M 145 804 C 145 830, 250 842, 385 842" class="edge" marker-end="url(#arrow)"/>

      <!-- terminal pseudo-state -->
      <circle cx="400" cy="842" r="13" fill="none" stroke="#23233a" stroke-width="1.8"/>
      <circle cx="400" cy="842" r="7" class="term"/>
    </svg>
